services:
  mysql-identity:
    image: mysql:8
    container_name: mysql-identity
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: identity_db
    ports:
      - "3309:3306"
    volumes:
      - mysql-identity-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity:
    build: .
    container_name: identity-service
    restart: unless-stopped
    depends_on:
      mysql-identity:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # inside the compose network MySQL listens on 3306 at hostname mysql-identity
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-identity:3306/identity_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

  # Web DB admin — browse identity_db at http://localhost:8082 (login: root / root, already pre-filled)
  phpmyadmin:
    image: phpmyadmin:5
    container_name: phpmyadmin-identity
    restart: unless-stopped
    depends_on:
      mysql-identity:
        condition: service_healthy
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql-identity
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M

volumes:
  mysql-identity-data:
